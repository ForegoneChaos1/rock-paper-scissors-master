<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Rock, Paper, Scissors</title>
</head>

<body>
  <main class="game-shell">
    <header class="top-bar" aria-label="Game header">
      <div class="brand">
        <img src="./images/logo.svg" alt="Rock Paper Scissors">
      </div>
      <div class="score-panel">
        <span class="score-label">Score</span>
        <span class="score-value">12</span>
      </div>
    </header>

    <section class="playarea" aria-live="polite">
      <div class="triangle-wrap">
        <img src="./images/bg-triangle.svg" alt="">
      </div>

      <button class="choice choice-paper" type="button" data-choice="paper" aria-label="Choose paper">
        <span class="choice-inner">
          <img src="./images/icon-paper.svg" alt="Paper icon">
        </span>
      </button>

      <button class="choice choice-scissors" type="button" data-choice="scissors" aria-label="Choose scissors">
        <span class="choice-inner">
          <img src="./images/icon-scissors.svg" alt="Scissors icon">
        </span>
      </button>

      <button class="choice choice-rock" type="button" data-choice="rock" aria-label="Choose rock">
        <span class="choice-inner">
          <img src="./images/icon-rock.svg" alt="Rock icon">
        </span>
      </button>
    </section>

    <section class="result-stage" aria-live="polite">
      <div class="result-slot">
        <span>You picked</span>
        <div class="result-choice result-player" aria-label="Your choice">
          <span class="choice-inner">
            <img src="./images/icon-rock.svg" alt="Your choice">
          </span>
        </div>
      </div>

      <div class="result-summary">
        <h2 id="round-result">You win</h2>
        <button class="play-again" type="button">Play again</button>
      </div>

      <div class="result-slot">
        <span>The house picked</span>
        <div class="result-choice result-house" aria-label="Computer choice">
          <span class="house-ghost" aria-hidden="true"></span>
          <span class="choice-inner">
            <img src="./images/icon-paper.svg" alt="Computer choice">
          </span>
        </div>
      </div>
    </section>

    <button class="rules-button" type="button">Rules</button>
  </main>

  <div class="modal hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="rules-title">Rules</h2>
        <button class="close-button" type="button">
          <img src="./images/icon-close.svg" alt="">
        </button>
      </div>
      <img class="rules-image" src="./images/image-rules.svg" alt="Rock paper scissors rules map">
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
